[project]
name = "beacon-clone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [

]

[project.optional-dependencies]
tui = [
    "textual[syntax]>=1.0",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[tool.coverage.run]
source = ["analytics", "graph", "ns", "tui"]
branch = true
# The coverage comment action reads the binary data file and needs paths that
# are meaningful outside the runner that produced them.
relative_files = true

[tool.coverage.report]
show_missing = true
# Set below the current total so ordinary variation does not fail a PR that is
# fine. CI enforces exactly this, because CI reads exactly this.
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(typing\\.)?overload",
    "\\.\\.\\.$",
    'if __name__ == "__main__":',
]
